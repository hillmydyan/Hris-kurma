server {
    listen 80;
    server_name _;
    client_max_body_size 50M;

    # Gzip Compression for High Performance
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Frontend SPA Root
    root /usr/share/nginx/html;
    index index.html;

    # Static Assets Cache (Vite JS/CSS/Fonts)
    location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Laravel Storage (Uploaded Photos, Avatars, Documents)
    location ^~ /storage/ {
        alias /var/www/backend/storage/app/public/;
        try_files $uri =404;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Laravel API Endpoints
    location ^~ /api {
        try_files $uri /index.php?$query_string;
    }

    # Laravel Sanctum Authentication
    location ^~ /sanctum {
        try_files $uri /index.php?$query_string;
    }

    # FastCGI PHP-FPM Handler for Laravel
    location = /index.php {
        fastcgi_pass app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 300;
    }

    # Any other PHP file direct access prevention
    location ~ \.php$ {
        fastcgi_pass app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public$fastcgi_script_name;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 300;
    }

    # Frontend React SPA Route Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security: Deny hidden files (.git, .env, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
